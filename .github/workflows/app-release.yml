# The desktop app for Linux, attached to a DRAFT release on a v* tag (the addin's own releases are commander-addin-v*).
name: App release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get install -y -q libasound2-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --release -p commander
        working-directory: app
      - run: |
          V=${GITHUB_REF_NAME#v}
          D=mpc-commander-$V-linux-x86_64
          mkdir -p "dist/$D"
          cp app/target/release/commander LICENSE "dist/$D/"
          cp app/README.md "dist/$D/README.md"
          tar -C dist -czf "dist/$D.tar.gz" "$D"
          sha256sum "dist/$D.tar.gz" > "dist/$D.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
