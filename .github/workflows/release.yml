# Build the addin for MPC OS and attach the zip to a DRAFT release, with mpc-vst-plugins' reusable workflow
# (its docs/ADDINS.md, "Releasing from CI"). mpc-vst-plugins is pinned to ONE commit in both places below, the same
# one as in test.yml.
# Run it from the Actions tab or `gh workflow run release.yml -f version=<x.y.z>`, then publish the draft.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the zip, addin.manifest and INSTALL.md, e.g. 0.1.0
        required: true
        type: string
      dry_run:
        description: Build and package only (the zip as a run artifact, no draft release)
        type: boolean
        default: false

jobs:
  addin:
    uses: sd88me/mpc-vst-plugins/.github/workflows/addin-release.yml@68da25ab50925ec9d3c7fc8e623087ee72338faa
    permissions: { contents: write }
    with:
      tag: commander-addin-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 68da25ab50925ec9d3c7fc8e623087ee72338faa
      package_dir: build
      build: ./build.sh
      package_dir_aarch64: build/aarch64
      build_aarch64: ./build-aarch64.sh
      host_test: sudo sysctl -q vm.mmap_rnd_bits=28 && tests/test.sh
      about: "The plugins MPC loads, with their own skins, and MPC's transport, in a desktop app (through an SSH tunnel by default)."
      license: MIT
      dry_run: ${{ inputs.dry_run }}
