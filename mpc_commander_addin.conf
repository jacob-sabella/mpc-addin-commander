# mpc-addin-commander settings (key=value; this file sits next to mpc_commander_addin.so)
# enabled=0 leaves the addin loaded but idle: plugins load untouched and nothing listens.
enabled=1
# Listen address and port. 0.0.0.0 is every network interface: anyone on the network can see and change the plugins.
bind=0.0.0.0
port=6730
# Connections at once, and the addin threads' nice value (0..19, higher is gentler).
max_clients=6
nice=10
# How often every instance's parameter values are read (ms), and how often their display text is re-read when no
# value moved (ms). An instance a client subscribed to has its text re-read at poll_ms.
poll_ms=100
text_ms=1000
# skins=0 stops serving the plugins' Plugin Skins folders (TUI.json and images) at /skin/<id>/.
skins=1
# midi=0 opens no "MPC Commander" sequencer port: no transport, no MIDI to or from the app. With the port open, enable it
# in MPC's MIDI preferences as an input (the app plays into MPC) and as an output with sync (the app follows MPC's
# clock, start/stop and song position, and MMC when Send MMC is on).
midi=1
# What a transport command from the app sends on the port: mmc (needs Receive MMC on in MPC), realtime (MIDI
# start/stop/continue; needs Start/Stop Sync receive on), both or none.
transport=both
# A file the device's own control-surface injector reads: the app's "surface" message appends raw MIDI bytes to it.
# Leave it to a path that doesn't exist (or "") when there is no injector.
surface=/data/midi.in
# MPC's settings file, read for the most recent project when the app asks for a project snapshot; project= names a
# project file to snapshot instead.
settings=/media/az01-internal/Settings/MPC/MPC.settings
project=""
