<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>MPC Commander</title>
<link rel="stylesheet" href="/web/style.css">
<link rel="preload" href="/web/fonts/TitilliumWeb-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
<script type="module" src="/web/app.js"></script>
</head>
<body>
<header class="bar">
  <button class="icon" id="menu" aria-label="Plugins" title="Plugins">&#9776;</button>
  <h1>MPC <span>Commander</span></h1>
  <div class="conn" id="conn" title="Connection"><i></i><span>connecting</span></div>
  <div class="device" id="device"></div>
</header>

<div class="transport" id="transport" hidden>
  <div class="buttons">
    <button data-cmd="play" title="Play">&#9654;</button>
    <button data-cmd="stop" title="Stop">&#9632;</button>
    <button data-cmd="record" class="rec" title="Record">&#9679;</button>
    <button data-cmd="continue" title="Continue">&#10148;&#xFE0E;</button>
  </div>
  <div class="readout"><b id="pos">1.1.000</b><span id="tempo">--- bpm</span><span id="tstate">stopped</span></div>
  <button class="chip" id="project-btn" title="Read the project file">Project</button>
</div>

<div class="main">
  <nav class="side" id="side">
    <div class="side-head">Plugins</div>
    <ul id="plugins"></ul>
    <p class="empty" id="no-plugins">No plugins open in MPC.</p>
  </nav>
  <section class="stage" id="stage">
    <div class="title" id="title"></div>
    <div class="tabs" id="tabs"></div>
    <div class="panel" id="panel">
      <canvas id="skin" hidden></canvas>
      <div class="generic" id="generic" hidden></div>
      <div class="status" id="status"></div>
    </div>
    <div class="tip" id="tip"></div>
    <div class="turn">Turn the phone sideways for a bigger panel.</div>
  </section>
  <aside class="project" id="project" hidden>
    <div class="side-head">Project <button class="icon small" id="project-close" aria-label="Close">&times;</button></div>
    <div id="project-body"></div>
  </aside>
</div>
</body>
</html>
